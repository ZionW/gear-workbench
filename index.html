<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="免費使用的齒輪生成與連動模擬工具：直齒、斜齒、內齒輪、齒條、多齒輪配置，以及 STL、STEP、DXF 匯出。">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>齒輪工坊 · Gear Workbench</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./assets/styles.css">
<script defer src="./assets/engine.js"></script>
<script defer src="./assets/exports.js"></script>
<script defer src="./assets/app.js"></script>
</head>
<body>
<noscript>此工具需要啟用 JavaScript，所有幾何計算都在您的瀏覽器中執行。</noscript>
<div id="gear-lab">
<header><div><h2>齒輪工坊 <span class="sub">Gear Workbench</span></h2><div class="sub">四種齒形 · 最多 12 零件 · 理想運動學模擬</div></div><span class="sub">mm / rpm / mm·s⁻¹</span></header>
<div class="toolbar scene-tools"><label>範例 <select id="v-preset"><option value="chain">直齒三級傳動</option><option value="helical">斜齒輪配對</option><option value="internal">內齒輪嚙合</option><option value="rack">齒條與小齒輪</option></select></label><button id="v-load">載入範例</button><button id="v-add">新增零件</button><button id="v-duplicate">複製零件</button><button id="v-undo" disabled>復原配置</button></div>
<div class="shell"><aside aria-label="選取零件參數">
<label class="field"><span>選取零件</span><select id="v-selected"></select></label>
<label class="field"><span>名稱</span><input id="v-name" maxlength="24" type="text"></label>
<label class="field"><span>齒輪類型</span><select id="v-type"><option value="spur">直齒外齒輪</option><option value="helical">斜齒外齒輪</option><option value="internal">內齒輪</option><option value="rack">齒條</option></select></label>
<div class="row"><label class="field"><span id="v-module-label">模數 m · mm</span><input id="v-m" type="number" min="0.3" max="10" step="any" list="v-module-options" aria-describedby="v-module-help"></label><label class="field"><span id="v-teeth-label">齒數 z</span><input id="v-teeth" type="number" min="8" max="100" step="1"></label></div>
<datalist id="v-module-options"><option value="0.3"></option><option value="0.4"></option><option value="0.5"></option><option value="0.6"></option><option value="0.8"></option><option value="1"></option><option value="1.25"></option><option value="1.5"></option><option value="2"></option><option value="2.5"></option><option value="3"></option><option value="4"></option><option value="5"></option><option value="6"></option><option value="8"></option><option value="10"></option></datalist><div id="v-module-help" class="sub module-help">可輸入自訂小數；只修改選取零件，嚙合輪需使用相同模數。</div>
<div class="row"><label class="field"><span id="v-alpha-label">壓力角 · °</span><input id="v-alpha" type="number" min="14.5" max="25" step="0.5"></label><label class="field"><span>齒寬 b · mm</span><input id="v-width" type="number" min="1" max="60" step="1"></label></div>
<label class="field" id="v-beta-wrap" hidden><span>螺旋角 β · °（＋右旋／−左旋）</span><input id="v-beta" type="number" min="-40" max="40" step="1"></label>
<label class="field" id="v-bore-wrap"><span>軸孔直徑 · mm</span><input id="v-bore" type="number" min="0" step="0.5"></label>
<label class="field" id="v-wall-wrap" hidden><span>內齒輪外環壁厚 · mm</span><input id="v-wall" type="number" min="0.3" max="100" step="0.5"></label>
<label class="field" id="v-base-wrap" hidden><span>齒條背厚 · mm</span><input id="v-base" type="number" min="0.3" max="100" step="0.5"></label>
<div class="section"><h3>位置與初相</h3><div class="row"><label class="field"><span>X · mm</span><input id="v-x" type="number" step="0.1"></label><label class="field"><span>Y · mm</span><input id="v-y" type="number" step="0.1"></label></div><div class="row"><label class="field"><span>Z · mm</span><input id="v-z" type="number" step="0.1"></label><label class="field" id="v-yaw-wrap"><span>齒條方向 · °</span><input id="v-yaw" type="number" step="1"></label></div><label class="field"><span id="v-phase-label">初始齒相 · °</span><input id="v-phase" type="number" step="0.5"></label><label class="check"><input id="v-fixed" type="checkbox">固定此零件</label></div>
<div class="section"><button id="v-delete">刪除此零件</button><div id="v-geometry-note" class="sub"></div></div>
</aside><main>
<div class="toolbar"><div class="segments" aria-label="預覽視圖"><button id="v-view2" aria-pressed="true">2D 配置</button><button id="v-view3" aria-pressed="false">3D 配置</button></div><label class="check"><input id="v-pitch" type="checkbox" checked>節圓／節線</label><button id="v-fit">適合視窗</button></div>
<div class="viewport"><canvas id="v-canvas" aria-label="多齒輪配置與連動模擬，可在 2D 拖曳零件位置"></canvas><span class="viewlabel" id="v-view-note">2D 拖曳零件 · X 向右 / Y 向上</span></div>
<div class="player"><div class="play-actions"><button class="primary" id="v-play">開始運轉</button><button id="v-reset">回到起點</button><button id="v-step">前進 0.1 秒</button><output id="v-time">0.00 s</output></div><div class="drive-fields"><label>主動零件<select id="v-driver"></select></label><label><span id="v-speed-label">轉速 · rpm</span><input id="v-speed" type="number" min="-300" max="300" step="1" value="30"></label><label class="check"><input id="v-autophase" type="checkbox" checked>自動對齒</label></div></div>
<div class="message" id="v-status" role="status" aria-live="polite"></div>
<section class="connection"><h3>連動關係</h3><div class="link-fields"><label>零件 A<select id="v-link-a"></select></label><label>零件 B<select id="v-link-b"></select></label><label>連動方式<select id="v-link-kind"><option value="mesh">齒面嚙合</option><option value="shaft">同軸剛接</option></select></label><label>相對方位 · °<input id="v-bearing" type="number" value="0" step="15"></label></div><div class="actions"><button id="v-link-align">對位並連動</button><button id="v-link-add">僅建立關係</button></div><div id="v-links"></div></section>
<section class="readout"><h3>連動狀態</h3><div class="table-wrap"><table><thead><tr><th>零件</th><th>類型</th><th>齒數</th><th>轉速／線速</th><th>狀態</th></tr></thead><tbody id="v-rates"></tbody></table></div></section>
<section class="outputs"><div class="output-title"><h3>複製與下載</h3><label>範圍<select id="v-scope"><option value="selected">選取零件</option><option value="all">整組配置</option></select></label></div><div class="actions"><button id="v-copy-svg">複製 SVG</button><button id="v-copy-rhino">複製 Rhino 3D 命令</button></div><div class="actions"><button id="v-dl-stl">下載 STL</button><button id="v-dl-step">下載 STEP</button><button id="v-dl-dxf">下載 DXF</button></div><div class="sub" id="v-output-note">匯出目前姿態 · mm · DXF/SVG 為 XY 投影；STEP 保留獨立實體</div><div id="v-output-status" class="sub" role="status" aria-live="polite"></div><textarea id="v-source" readonly hidden aria-label="可手動複製的 Rhino 命令"></textarea></section>
</main></div><footer>固定輪心、平行軸的理想運動學；編輯配置會回到起點。未計算負載、摩擦、彈性、背隙及完整齒面接觸；簡化齒根與平滑齒形近似。</footer>
</div>

</body>
</html>
